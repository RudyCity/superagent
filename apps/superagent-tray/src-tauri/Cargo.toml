[package]
name = "superagent-tray"
version = "1.14.80"
description = "SuperAgent tray and daemon cron manager"
edition = "2021"

[[bin]]
name = "superagent-tray"
path = "src/main.rs"

[[bin]]
name = "superagent"
path = "src/cli_launcher.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-notification = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-single-instance = "2.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "macros"] }
dirs = "6"
sysinfo = "0.30.13"

uuid = { version = "1", features = ["v4"] }

base64 = "0.22"
sha2 = "0.10"
