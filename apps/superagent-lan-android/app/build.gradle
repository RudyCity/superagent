apply plugin: 'com.android.application'

android {
    namespace 'click.superagent.lanclient'
    compileSdk 35

    defaultConfig {
        applicationId 'click.superagent.lanclient'
        minSdk 29
        targetSdk 35
        versionCode 14
        versionName '0.9.1-qr-scan-fix'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
        // Reduced-capability diagnostic build. Accessibility is excluded from
        // the installed manifest, so remote touch and UI schema are unavailable.
        lite {
            initWith debug
            matchingFallbacks = ['debug']
            applicationIdSuffix '.lite'
            versionNameSuffix '-lite'
            signingConfig signingConfigs.debug
            debuggable true
        }
    }
}


dependencies {
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
