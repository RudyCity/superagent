[package]
name = "superagent-lan-windows"
version = "0.1.0"
description = "SuperAgent Windows device receiver"
authors = ["SuperAgent"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
quircs = "0.10"
tauri-plugin-dialog = "2.8"
