name: SuperAgent Installer and Tray CI
on:
  push:
    branches: [main]
    paths:
      - "apps/superagent-tray/**"
      - ".github/workflows/tray-build.yml"
      - "scripts/*standalone*.ts"
      - "scripts/verify-installed-standalone-windows.ps1"
      - "src/**"
      - "package.json"
      - "bun.lock"
  pull_request:
    paths:
      - "apps/superagent-tray/**"
      - ".github/workflows/tray-build.yml"
      - "scripts/*standalone*.ts"
      - "src/**"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tray-build:
    name: Standalone / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2025
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: macos-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 110
    env:
      CI: "true"

    steps:
      - uses: actions/checkout@v4
      - name: Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev build-essential curl wget file
          sudo apt-get install -y -qq libayatana-appindicator3-dev || sudo apt-get install -y -qq libappindicator3-dev
      - name: Configure linuxdeploy AppImage compatibility
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo 'NO_STRIP=true' >> "$GITHUB_ENV"
          echo 'APPIMAGE_EXTRACT_AND_RUN=1' >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/superagent-tray/src-tauri -> target"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Build Core
        run: bun run build
      - name: Verify Chrome extension syntax
        run: bun run verify:extension-js
      - name: Core & packaging regression
        run: bun --bun x vitest run tests/toolRegistryConsistency.test.ts tests/desktopRuntimeUi.test.ts tests/mediaTransforms.test.ts tests/mediaFormatGuard.test.ts tests/mediaPlanner.test.ts tests/windowsStandaloneInstaller.test.ts tests/prebuiltWindowsInstaller.test.ts tests/unixStandaloneInstaller.test.ts
      - name: Native Rust regression
        run: cargo test --manifest-path apps/superagent-tray/src-tauri/Cargo.toml
      - name: Build CLI launcher
        run: cargo build --release --bin superagent --manifest-path apps/superagent-tray/src-tauri/Cargo.toml
      - name: Prepare Windows standalone distribution
        if: runner.os == 'Windows'
        run: bun run installer:prepare
      - name: Verify portable Windows CLI
        if: runner.os == 'Windows'
        run: bun run installer:verify
      - name: Package Windows setup
        if: runner.os == 'Windows'
        run: bun run installer:package
      - name: Prepare Unix standalone distribution
        if: runner.os != 'Windows'
        run: bun run installer:prepare:unix
      - name: Verify portable Unix CLI
        if: runner.os != 'Windows'
        run: bun run installer:verify:unix
      - name: Package macOS DMG or Linux DEB/AppImage
        if: runner.os != 'Windows'
        run: bun run installer:package:unix
      - name: Diagnose linuxdeploy AppImage packaging failure
        if: failure() && runner.os == 'Linux'
        shell: bash
        run: |
          set -uo pipefail
          bundle="apps/superagent-tray/src-tauri/target/release/bundle/appimage"
          echo '=== AppImage staging files ==='
          find "$bundle" -maxdepth 2 -mindepth 1 -printf '%p %s bytes\\n' 2>/dev/null | head -80 || true
          echo '=== Cached linuxdeploy executables ==='
          find "$HOME/.cache/tauri" -maxdepth 3 -name '*linuxdeploy*' -print 2>/dev/null || true
          mapfile -t deploy < <(find "$HOME/.cache/tauri" -maxdepth 3 -name 'linuxdeploy-*-x86_64.AppImage' -type f 2>/dev/null)
          mapfile -t appdirs < <(find "$bundle" -maxdepth 1 -name '*.AppDir' -type d 2>/dev/null)
          if [[ "${#deploy[@]}" -gt 0 && "${#appdirs[@]}" -gt 0 ]]; then
            echo '=== Reproducing linuxdeploy with full output on disposable CI runner ==='
            export NO_STRIP=true APPIMAGE_EXTRACT_AND_RUN=1
            code=0
            timeout 120s "${deploy[0]}" --appdir "${appdirs[0]}" --plugin gtk --output appimage > "$RUNNER_TEMP/linuxdeploy-diagnostic.log" 2>&1 || code=$?
            echo "linuxdeploy reproduction exit=$code"
            tail -n 180 "$RUNNER_TEMP/linuxdeploy-diagnostic.log" || true
          else
            echo 'No reusable linuxdeploy executable or AppDir staging directory found.'
          fi
      - name: Verify installed Windows setup on disposable runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-installed-standalone-windows.ps1
      - name: Verify packaged Unix launcher and payload
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/verify-packaged-standalone-unix.sh
      - name: Upload Windows setup
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: superagent-standalone-windows-x64
          path: apps/superagent-tray/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: superagent-standalone-macos-arm64
          path: apps/superagent-tray/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
      - name: Upload Linux DEB and AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: superagent-standalone-linux-x64
          path: |
            apps/superagent-tray/src-tauri/target/release/bundle/deb/*.deb
            apps/superagent-tray/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30
