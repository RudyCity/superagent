name: SuperAgent Multi-OS Installer & Tray Build
on:
  push:
    branches: [main]
    paths:
      - "apps/superagent-tray/**"
      - ".github/workflows/tray-build.yml"
      - "src/**"
      - "package.json"
  pull_request:
    paths:
      - "apps/superagent-tray/**"
      - ".github/workflows/tray-build.yml"
      - "src/**"
      - "package.json"
  workflow_dispatch:

jobs:
  tray-build:
    name: Package / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: macos-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (WebKitGTK, AppIndicator)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file
          sudo apt-get install -y -qq libayatana-appindicator3-dev || sudo apt-get install -y -qq libappindicator3-dev || true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/superagent-tray/src-tauri -> target"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SuperAgent Core
        run: bun run build

      - name: Test Tray Rust backend
        run: cargo test --manifest-path apps/superagent-tray/src-tauri/Cargo.toml

      - name: Build SuperAgent Package & Installer
        run: |
          cd apps/superagent-tray
          bunx @tauri-apps/cli build --ci

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: superagent-installer-${{ matrix.platform }}
          path: |
            apps/superagent-tray/src-tauri/target/release/bundle/
            apps/superagent-tray/src-tauri/target/release/superagent-tray
            apps/superagent-tray/src-tauri/target/release/superagent-tray.exe
            apps/superagent-tray/src-tauri/target/release/superagent
            apps/superagent-tray/src-tauri/target/release/superagent.exe
          if-no-files-found: warn
