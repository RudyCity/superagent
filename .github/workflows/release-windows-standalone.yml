name: SuperAgent Windows Standalone Prerelease
on:
  push:
    tags:
      - 'v*-rc.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: standalone-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Verify, package, publish Windows x64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CI: "true"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable tag matches package version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)-rc\.\d+$') { throw "Only release candidates are allowed" }
          if ($Matches[1] -ne $version) { throw "Tag and package version do not match" }
          if ((git status --porcelain).Length -gt 0) { throw "Source checkout is dirty" }

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/superagent-tray/src-tauri -> target"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Locked install
        run: bun install --frozen-lockfile

      - name: Build Core
        run: bun run build

      - name: Verify extension JavaScript
        run: bun run verify:extension-js

      - name: Bounded Core regression gate
        run: bun --bun x vitest run tests/toolRegistryConsistency.test.ts tests/promptToolGuidance.test.ts tests/pdfPrimaryMcpIntegration.test.ts tests/mediaTransforms.test.ts tests/mediaFormatGuard.test.ts tests/mediaPlanner.test.ts tests/windowsStandaloneInstaller.test.ts tests/desktopRuntimeUi.test.ts

      - name: Test native Tray
        run: bun run tray:test

      - name: Build native CLI launcher
        run: cargo build --release --bin superagent --manifest-path apps/superagent-tray/src-tauri/Cargo.toml

      - name: Prepare production-only standalone resources
        run: bun run installer:prepare

      - name: Assert portable CLI starts without installed Bun/Node
        run: bun run installer:verify

      - name: Package signed-source but unsigned-application NSIS setup
        run: bun run installer:package

      - name: Verify versioned installer and write SHA256 checksums
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = "apps/superagent-tray/src-tauri/target/release/bundle/nsis/SuperAgent_${v}_x64-setup.exe"
          if (!(Test-Path $setup)) { throw "Missing setup artifact $setup" }
          if ((Get-Item $setup).Length -lt 20000000) { throw "Truncated setup artifact" }
          $sum = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$sum  $(Split-Path -Leaf $setup)" | Set-Content SHA256SUMS.txt -Encoding utf8NoBOM
          Get-Content SHA256SUMS.txt

      - name: Install, run CLI and uninstall on disposable Windows runner
        shell: pwsh
        run: ./scripts/verify-installed-standalone-windows.ps1

      - name: Publish prerelease assets only after all gates pass
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = "apps/superagent-tray/src-tauri/target/release/bundle/nsis/SuperAgent_${v}_x64-setup.exe"
          gh release create $tag $setup SHA256SUMS.txt --repo "${{ github.repository }}" --verify-tag --prerelease --generate-notes --title "SuperAgent $v Standalone Windows (RC)"
        env:
          GH_TOKEN: ${{ github.token }}
