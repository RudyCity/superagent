name: SuperAgent Multi-OS Standalone Prerelease
on:
  push:
    tags:
      - 'v*-rc.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & test ${{ matrix.platform }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2025
          - platform: macos-arm64
            os: macos-15
          - platform: linux-x64
            os: ubuntu-24.04
    env:
      CI: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev build-essential curl wget file musl
          sudo apt-get install -y -qq libayatana-appindicator3-dev || sudo apt-get install -y -qq libappindicator3-dev
      - name: Configure linuxdeploy AppImage compatibility
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo 'NO_STRIP=true' >> "$GITHUB_ENV"
          echo 'APPIMAGE_EXTRACT_AND_RUN=1' >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/superagent-tray/src-tauri -> target"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Verify release-candidate tag matches package version
        shell: bash
        run: |
          bun -e 'const v = require("./package.json").version; const ref = process.env.GITHUB_REF_NAME || ""; const prefix = "v" + v + "-rc."; const suffix = ref.slice(prefix.length); if (!ref.startsWith(prefix) || !suffix.length || !suffix.split("").every(c => c >= "0" && c <= "9")) throw Error("Release tag/version mismatch"); console.log(ref)'
      - name: Locked install
        run: bun install --frozen-lockfile
      - name: Build Core
        run: bun run build
      - name: Validate Unix host architecture and macOS ScreenCaptureKit SDK
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/verify-desktop-live-unix-host.sh
      - name: Build and verify opt-in Windows Graphics Capture helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-desktop-live-wgc.ps1
          bun --bun x vitest run tests/desktop-live/windowsWgcArtifact.test.ts tests/desktop-live/windowsInstalledBundleSmoke.test.ts --maxWorkers=1
      - name: Build and verify macOS ScreenCaptureKit helper
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash scripts/build-desktop-live-sck.sh
          bun --bun x vitest run tests/desktop-live/macSckArtifact.test.ts tests/desktop-live/scopedNativeWorker.test.ts --maxWorkers=1
      - name: Build and verify Linux X11 native window worker
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash scripts/build-desktop-live-x11.sh
          bun --bun x vitest run tests/desktop-live/linuxX11Artifact.test.ts tests/desktop-live/linuxPortalPolicy.test.ts tests/desktop-live/scopedNativeWorker.test.ts --maxWorkers=1
      - name: Verify extension syntax
        run: bun run verify:extension-js
      - name: Core & package regression gate
        run: bun --bun x vitest run tests/toolRegistryConsistency.test.ts tests/promptToolGuidance.test.ts tests/pdfPrimaryMcpIntegration.test.ts tests/mediaTransforms.test.ts tests/mediaFormatGuard.test.ts tests/mediaPlanner.test.ts tests/windowsStandaloneInstaller.test.ts tests/prebuiltWindowsInstaller.test.ts tests/unixStandaloneInstaller.test.ts tests/desktopRuntimeUi.test.ts tests/mcpBackendBundleProducer.test.ts tests/mcpBackendGithubRelease.test.ts tests/mcpBackendReleaseStager.test.ts tests/mcpBackendReleasePolicy.test.ts tests/unifiedReleaseContract.test.ts tests/recoverUnifiedReleaseContract.test.ts tests/mcpTunnelAnchorObserver.test.ts tests/mcpNamedTunnelConfig.test.ts tests/mcpNamedTunnelAnchor.test.ts tests/mcpNamedRemoteProfile.test.ts tests/desktopNamedTunnelRuntimeUi.test.ts tests/desktopNamedTunnelSettingsUi.test.ts tests/desktopNamedTunnelManagerUi.test.ts tests/mcpNamedTunnelManagerContract.test.ts tests/mcpNamedRecoveryPlan.test.ts tests/mcpNamedOAuthReadiness.test.ts tests/mcpNamedLauncherBundle.test.ts tests/mcpNamedAnchorShutdown.test.ts tests/desktop-live/unixCapturePackaging.test.ts tests/desktop-live/unixArtifactAudit.test.ts --maxWorkers=1
      - name: Test independent MCP Anchor and Windows owner lifecycle
        if: runner.os == 'Windows'
        run: bun --bun x vitest run tests/mcpTunnelAnchor.test.ts tests/mcpTunnelAnchorManagedOwner.test.ts tests/mcpReloadableOwner.test.ts tests/mcpNamedRemoteAnchorCli.test.ts tests/mcpNamedOwnerStartupE2E.test.ts --maxWorkers=2
      - name: Test native Tray
        run: bun run tray:test
      - name: Compile native CLI
        run: cargo build --release --bin superagent --manifest-path apps/superagent-tray/src-tauri/Cargo.toml
      - name: Stage Windows portable resources
        if: runner.os == 'Windows'
        run: bun run installer:prepare
      - name: Verify Windows portable Core
        if: runner.os == 'Windows'
        run: bun run installer:verify
      - name: Package checksummed, versioned MCP backend candidate
        if: runner.os == 'Windows'
        run: bun scripts/package-mcp-backend-release.ts
      - name: Verify isolated MCP backend candidate without installation
        if: runner.os == 'Windows'
        run: bun scripts/verify-mcp-backend-bundle.ts
      - name: Build standalone Windows NSIS
        if: runner.os == 'Windows'
        run: bun run installer:package
      - name: Verify compressed NSIS includes checksum-pinned WGC
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-wgc-windows-nsis.ps1
      - name: Stage macOS or Linux portable resources
        if: runner.os != 'Windows'
        run: bun run installer:prepare:unix
      - name: Verify Unix portable Core
        if: runner.os != 'Windows'
        run: bun run installer:verify:unix
      - name: Build macOS DMG or Linux DEB/AppImage
        if: runner.os != 'Windows'
        run: bun run installer:package:unix
      - name: Install, test, uninstall on disposable Windows runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-installed-standalone-windows.ps1
      - name: Verify assembled Unix bundle and CLI
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/verify-packaged-standalone-unix.sh
      - name: Audit extracted DMG / DEB / AppImage Desktop Live payload and receipt
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/verify-desktop-live-unix-packages.sh
      - name: Validate Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = "apps/superagent-tray/src-tauri/target/release/bundle/nsis/SuperAgent_${v}_x64-setup.exe"
          if (!(Test-Path $setup) -or (Get-Item $setup).Length -lt 20000000) { throw "Missing or truncated Windows installer" }
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: apps/superagent-tray/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: Upload independently verified Windows MCP backend bundle
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-mcp-backend-windows-x64
          path: build/release-mcp-backend/SuperAgent-MCP-Backend-*-windows-x64.tgz
          if-no-files-found: error
          compression-level: 0
      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: apps/superagent-tray/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: |
            apps/superagent-tray/src-tauri/target/release/bundle/deb/*.deb
            apps/superagent-tray/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
  build-extensions:
    name: Build verified Chrome Delegate and SidePanel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run verify:extension-js
      - run: bun scripts/release-delegate.mjs
      - run: bun scripts/release-sidepanel.mjs
      - run: bun scripts/verify-release-extensions.mjs
      - run: bun scripts/stage-release-extensions.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-browser-extensions
          path: build/release-extension-upload/*
          if-no-files-found: error

  build-android:
    name: Build verified Android LAN preview APK (debug-signed)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Build real Gradle APK with hosted Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager_bin" && test -x "$sdkmanager_bin"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$sdkmanager_bin" --licenses > "$RUNNER_TEMP/android-sdk-licenses.log" 2>&1
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          if [[ "$license_status" -ne 0 ]]; then
            tail -n 40 "$RUNNER_TEMP/android-sdk-licenses.log"
            exit "$license_status"
          fi
          "$sdkmanager_bin" --install 'platforms;android-35' 'build-tools;35.0.0'
          (cd apps/superagent-lan-android && bash ./gradlew --no-daemon :app:assembleDebug)
          apk=apps/superagent-lan-android/app/build/outputs/apk/debug/app-debug.apk
          metadata=apps/superagent-lan-android/app/build/outputs/apk/debug/output-metadata.json
          test -s "$apk" && test -s "$metadata"
          "$sdk_root/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          python3 -c 'import json,sys,zipfile; p,m=sys.argv[1:]; z=zipfile.ZipFile(p); assert "AndroidManifest.xml" in z.namelist() and any(x.startswith("classes") and x.endswith(".dex") for x in z.namelist()); d=json.load(open(m)); assert d["applicationId"] == "click.superagent.lanclient" and d["variantName"] == "debug"; print("ANDROID_APK_VALID",d["elements"][0]["versionName"])' "$apk" "$metadata"
          version="$(python3 -c 'import json; print(json.load(open("apps/superagent-lan-android/app/build/outputs/apk/debug/output-metadata.json"))["elements"][0]["versionName"])')"
          [[ "$version" =~ ^[a-zA-Z0-9._-]+$ ]]
          mkdir -p release-android
          cp "$apk" "release-android/SuperAgent-LAN-Android-${version}-debug.apk"
          cp "$metadata" "release-android/SuperAgent-LAN-Android-${version}-metadata.json"
      - name: Validate QR and device-download contract with real APK
        run: |
          bun install --frozen-lockfile
          bun --bun x vitest run tests/deviceTunnelApkDownload.test.ts tests/deviceTunnelHttp.test.ts --maxWorkers=1
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-lan-preview
          path: release-android/*
          if-no-files-found: error

  build-lan-windows:
    name: Build and verify Windows LAN receiver GUI preview
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/superagent-lan-windows/src-tauri -> target"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun --bun x tsc --noEmit --pretty false
      - name: Test Windows LAN receiver safety independently of APK
        run: bun --bun x vitest run tests/desktopLanWindowsGui.test.ts tests/windowsQrConnect.test.ts tests/deviceTunnelBroker.test.ts tests/lanRemote.test.ts --maxWorkers=1
      - run: bun scripts/build-lan-windows-gui.ts
      - run: bun scripts/verify-lan-gui-receiver.ts
      - name: Verify unsigned development LAN installer size
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $file = "artifacts/lan-client/SuperAgent-LAN-Client-0.2.0-Windows-x64-setup.exe"
          if (!(Test-Path -LiteralPath $file) -or (Get-Item -LiteralPath $file).Length -lt 20000000) {
            throw "Windows LAN receiver installer missing or truncated"
          }
          Write-Host "LAN_WINDOWS_PREVIEW_UNSIGNED" (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
      - uses: actions/upload-artifact@v4
        with:
          name: release-lan-windows-preview
          path: artifacts/lan-client/SuperAgent-LAN-Client-0.2.0-Windows-x64-setup.exe
          if-no-files-found: error

  publish:
    name: Publish unified verified standalone and preview components
    needs: [build, build-extensions, build-android, build-lan-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: downloaded-assets
          merge-multiple: true
      - name: Require exact multi-OS installers, extensions and LAN preview assets
        shell: bash
        run: |
          set -euo pipefail
          # Multi-path Linux artifact uploads retain appimage/ and deb/ folders.
          # Flatten only those version-pinned, regular files before strict inventory verification.
          node scripts/normalize-unified-release-assets.mjs downloaded-assets
          node scripts/verify-unified-release-assets.mjs downloaded-assets
          mkdir -p release-assets
          cp -- downloaded-assets/* release-assets/
          (cd release-assets && sha256sum ./* > ../SHA256SUMS.txt)
          test "$(wc -l < SHA256SUMS.txt)" -eq 12
          cat SHA256SUMS.txt
      - name: Publish single complete GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          core_version="$(node -p 'require("./package.json").version')"
          delegate_version="$(node -p 'require("./chrome-extension-delegate/manifest.json").version')"
          sidepanel_version="$(node -p 'require("./chrome-extension/manifest.json").version')"
          lan_version="$(node -p 'require("./apps/superagent-lan-windows/src-tauri/tauri.conf.json").version')"
          android_version="$(grep -oE "versionName '[^']+'" apps/superagent-lan-android/app/build.gradle | cut -d"'" -f2)"
          cat > RELEASE_NOTES.md <<EOF
          # SuperAgent $GITHUB_REF_NAME — Unified Multi-OS & Extensions Release

          Built from release tag \`$GITHUB_REF_NAME\` with independent, mandatory CI verification gates.

          ### Component Versions & Downloads
          - **Windows x64 (v${core_version})**: \`SuperAgent_${core_version}_x64-setup.exe\` — Standalone NSIS installer (Tray + Core + Bun + native CLI).
          - **Ubuntu / Debian Linux x64 (v${core_version})**: \`SuperAgent_${core_version}_amd64.deb\` — Debian/Ubuntu native package.
          - **Linux x64 Portable (v${core_version})**: \`SuperAgent_${core_version}_amd64.AppImage\` — Standalone AppImage with verified glibc native addons.
          - **macOS ARM64 Apple Silicon (v${core_version})**: \`SuperAgent_${core_version}_aarch64.dmg\` — Unsigned DMG bundle.
          - **Chrome Delegate Extension (v${delegate_version})**: \`superagent-delegate-${delegate_version}.zip\` (with verified receipt) — MV3 developer extension for ChatGPT automation.
          - **Chrome SidePanel Extension (v${sidepanel_version})**: \`superagent-sidepanel-${sidepanel_version}.zip\` (with verified receipt) — MV3 AI assistant sidepanel.
          - **Windows LAN Receiver GUI (v${lan_version})**: \`SuperAgent-LAN-Client-${lan_version}-Windows-x64-setup.exe\` — Desktop LAN client unsigned preview installer.
          - **Android LAN Preview (v${android_version})**: \`SuperAgent-LAN-Android-${android_version}-debug.apk\` + metadata — Debug-signed APK.
          - **Windows x64 MCP backend bundle (v${core_version})**: \`SuperAgent-MCP-Backend-${core_version}-windows-x64.tgz\` — immutable side-by-side backend only; no automatic owner/tunnel restart.
          - **Checksum Manifest**: \`SHA256SUMS.txt\` — SHA-256 checksums for all 12 binary, archive and metadata assets.

          The release does not migrate users, modify Core/MCP ownership, restart a
          running instance or certify production deployment (R0–R7 remain separate).
          Verify checksum and provenance before installing.
          EOF
          release_title="SuperAgent $GITHUB_REF_NAME — Windows v${core_version}, Ubuntu v${core_version}, macOS v${core_version}, Delegate v${delegate_version}, SidePanel v${sidepanel_version}, LAN v${lan_version}, Android v${android_version}"
          gh release create "$GITHUB_REF_NAME" release-assets/* SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --notes-file RELEASE_NOTES.md \
            --title "$release_title"
