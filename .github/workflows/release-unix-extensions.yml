name: SuperAgent macOS Linux and Chrome Extension Prerelease
on:
  push:
    tags:
      - 'v*-unix.*'

permissions:
  contents: read

concurrency:
  group: superagent-unix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-unix:
    name: Build and verify ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-15
          - platform: linux-x64
            os: ubuntu-24.04
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Linux native packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev build-essential curl wget file musl
          sudo apt-get install -y -qq libayatana-appindicator3-dev || sudo apt-get install -y -qq libappindicator3-dev
      - name: Configure linuxdeploy compatibility
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo 'NO_STRIP=true' >> "$GITHUB_ENV"
          echo 'APPIMAGE_EXTRACT_AND_RUN=1' >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/superagent-tray/src-tauri -> target"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Verify Unix prerelease tag and metadata
        shell: bash
        run: |
          set -euo pipefail
          bun -e 'const v=require("./package.json").version; const r=process.env.GITHUB_REF_NAME; if (!new RegExp("^v"+v.replace(/\./g,"\\.")+"-unix\\.[0-9]+$").test(r)) throw Error("Unix tag/version mismatch"); const t=require("./apps/superagent-tray/src-tauri/tauri.conf.json"); if(t.version!==v) throw Error("Tauri version mismatch"); console.log(r)'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build Core
        run: bun run build
      - name: Validate extension JS
        run: bun run verify:extension-js
      - name: Run portable/Tray regression suite
        run: bun --bun x vitest run tests/toolRegistryConsistency.test.ts tests/promptToolGuidance.test.ts tests/pdfPrimaryMcpIntegration.test.ts tests/mediaTransforms.test.ts tests/mediaFormatGuard.test.ts tests/mediaPlanner.test.ts tests/windowsStandaloneInstaller.test.ts tests/prebuiltWindowsInstaller.test.ts tests/unixStandaloneInstaller.test.ts tests/desktopRuntimeUi.test.ts tests/bunGlobalInstallContract.test.ts tests/releaseExtensions.test.ts tests/releaseUnixAppImage.test.ts tests/pruneLinuxMuslSharp.test.ts --maxWorkers=1
      - name: Test native Tray
        run: bun run tray:test
      - name: Compile native CLI
        run: cargo build --release --bin superagent --manifest-path apps/superagent-tray/src-tauri/Cargo.toml
      - name: Stage macOS or Linux runtime
        run: bun run installer:prepare:unix
      - name: Verify portable runtime without global Bun
        run: bun run installer:verify:unix
      # Do not set SUPERAGENT_UNIX_BUNDLE_OVERRIDE here: full releases require both Linux packages.
      - name: Build macOS DMG or Linux DEB and AppImage
        run: bun run installer:package:unix
      - name: Inspect and smoke-test bundled macOS app or Linux DEB
        shell: bash
        run: bash scripts/verify-packaged-standalone-unix.sh
        env:
          REQUIRE_APPIMAGE: "1"
      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: unix-release-macos-arm64
          path: apps/superagent-tray/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Upload Linux DEB and AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: unix-release-linux-x64
          path: |
            apps/superagent-tray/src-tauri/target/release/bundle/deb/*.deb
            apps/superagent-tray/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  build-extensions:
    name: Build and verify Chrome Delegate and SidePanel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify extension syntax
        run: bun run verify:extension-js
      - name: Package Delegate extension
        run: bun scripts/release-delegate.mjs
      - name: Package SidePanel extension
        run: bun scripts/release-sidepanel.mjs
      - name: Verify ZIP contents and checksums
        run: bun scripts/verify-release-extensions.mjs
      - name: Stage manifest-pinned extension archives only
        run: bun scripts/stage-release-extensions.mjs
      - name: Upload both extensions and receipts
        uses: actions/upload-artifact@v4
        with:
          name: unix-release-chrome-extensions
          path: build/release-extension-upload/*
          if-no-files-found: error

  publish:
    name: Publish verified macOS, Linux and extension prerelease
    needs: [build-unix, build-extensions]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: unix-release-*
          merge-multiple: true
          path: downloaded-assets
      - name: Require exact macOS DMG, Linux DEB and both extensions
        shell: bash
        run: |
          set -euo pipefail
          find downloaded-assets -type f -printf '%P %s bytes\\n' | sort
          mkdir -p release-assets
          for pattern in "*.dmg" "*.deb" "*.AppImage" "superagent-delegate-*.zip" "superagent-delegate-*.receipt.json" "superagent-sidepanel-*.zip" "superagent-sidepanel-*.receipt.json"; do
            mapfile -d '' found < <(find downloaded-assets -type f -name "$pattern" -print0)
            [[ "${#found[@]}" -eq 1 ]] || { echo "Expected one $pattern, found ${#found[@]}"; exit 1; }
            cp -- "${found[0]}" "release-assets/$(basename "${found[0]}")"
          done
          [[ "$(find downloaded-assets -type f | wc -l)" -eq 7 ]] || { echo "Unexpected additional release artifacts"; exit 1; }
          dmgs=(release-assets/*.dmg)
          debs=(release-assets/*.deb)
          appimages=(release-assets/*.AppImage)
          version="$(node -p "require('./package.json').version")"
          for file in "${dmgs[0]}" "${debs[0]}" "${appimages[0]}"; do
            [[ "$(basename "$file")" == *"${version}"* ]] || { echo "Installer version mismatch: $file"; exit 1; }
            [[ "$(stat -c%s "$file")" -gt 20000000 ]] || { echo "Installer too small: $file"; exit 1; }
          done
          (cd release-assets && sha256sum * > ../SHA256SUMS.txt)
          cat SHA256SUMS.txt
      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > RELEASE_NOTES.md <<'EOF'
          # SuperAgent macOS arm64 and Linux x64 standalone prerelease

          These builds include SuperAgent Tray, Core, the native CLI launcher,
          bundled Bun runtime and production dependencies. No local Rust build
          toolchain or separately installed Bun/Node.js is required for users.

          - macOS: Apple Silicon (arm64) DMG; unsigned/unnotarized prerelease,
            so macOS Gatekeeper may prevent opening without explicit approval.
          - Linux: x64 DEB for compatible Debian/Ubuntu releases and portable
            AppImage for desktop Linux distributions. The DEB GUI runtime
            depends on system WebKitGTK/appindicator libraries.
          - Chrome: SuperAgent Delegate and SuperAgent SidePanel are **separate**
            unpacked extensions shipped as source ZIPs. Extract each ZIP to its
            own folder and use Chrome -> Extensions -> Developer mode -> Load unpacked.
            These are not Chrome Web Store publications.

          Linux AppImage, DEB and macOS DMG pass dedicated packaging and
          packaged-payload verification gates before publication.

          Verify all downloaded files against SHA256SUMS.txt. This prerelease is
          not a production runtime cutover or signed distribution.
          EOF
          gh release create "$GITHUB_REF_NAME" release-assets/* SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --notes-file RELEASE_NOTES.md \
            --title "SuperAgent $GITHUB_REF_NAME — macOS, Linux and Chrome extensions"
