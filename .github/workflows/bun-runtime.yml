name: Bun Runtime Validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  runtime:
    name: Bun runtime / OS
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run ext:css
      - run: bun run verify:extension-js
      - run: bun run runtime:acceptance
      - run: bun run perf:bun
      - run: bun --bun x vitest run tests/nativeGlob.test.ts tests/globPatternGuard.test.ts tests/bunMcpRegistration.test.ts tests/serverAuth.test.ts tests/ProcessPool.test.ts tests/processMailbox.test.ts
      - name: Windows-only path, lifecycle and process-policy regression
        if: runner.os == 'Windows'
        run: bun --bun x vitest run --maxWorkers=2 tests/workspaceCatalog.test.ts tests/workspaceCatalogClassifier.test.ts tests/browserRuntimeWindowsRegression.test.ts tests/processSupervisorBatch4Remediation.test.ts tests/processSupervisorBatch5Remediation.test.ts tests/mcpProcessBirthR1.test.ts
  regression:
    name: Full regression (bounded concurrency)
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      # Ubuntu 24.04's chromium-browser apt package is only a Snap bootstrapper.
      # GitHub runners cannot rely on access to the Snap Store.
      - name: Install FFmpeg and media runtime libraries (no Snap)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libblas3 ripgrep iproute2
          command -v ss
          ss -tlnp > /dev/null  # Kernel PID evidence required by managed Vision ownership
          test -x /usr/bin/ffmpeg
          test -x /usr/bin/ffprobe
          if ldd /usr/bin/ffmpeg | grep -F 'not found'; then
            echo 'FFmpeg has unresolved shared libraries' >&2
            exit 1
          fi
          /usr/bin/ffmpeg -hide_banner -version
          /usr/bin/ffprobe -hide_banner -version
          /usr/bin/ffmpeg -hide_banner -loglevel error -f lavfi -i 'color=c=black:s=64x64:d=0.2' -c:v libx264 -pix_fmt yuv420p -y "$RUNNER_TEMP/ffmpeg-ci-smoke.mp4"
          /usr/bin/ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 "$RUNNER_TEMP/ffmpeg-ci-smoke.mp4" | grep -Fx codec_name=h264
          # Prefer the apt-installed FFmpeg over incompatible preinstalled wrappers.
          echo '/usr/bin' >> "$GITHUB_PATH"
      - name: Install Chrome for Testing without Snap
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Verify Chrome browser runtime
        shell: bash
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          test -x "$CHROME_BINARY"
          "$CHROME_BINARY" --version
          timeout 30s "$CHROME_BINARY" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --dump-dom about:blank > "$RUNNER_TEMP/chrome-ci-smoke.html"
          grep -qi '<html' "$RUNNER_TEMP/chrome-ci-smoke.html"
          echo "STUDIO_CHROMIUM_PATH=$CHROME_BINARY" >> "$GITHUB_ENV"
      - name: Install Office document converters
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress
          libreoffice --headless --version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF and media integration backends
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r scripts/pdf-vector-requirements.txt 'pymupdf==1.26.5' 'Pillow==11.3.0' 'numpy==2.3.4' 'python-docx==1.2.0' 'python-pptx==1.0.2' 'openpyxl==3.1.5'
          python -c 'import fitz, pikepdf, PIL, numpy, docx, pptx, openpyxl; print("PDF_MEDIA_BACKENDS_OK", fitz.VersionBind, pikepdf.__version__)'
          echo "SUPERAGENT_PDF_PYTHON_BIN=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build real Android debug APK for download-ticket integration
        shell: bash
        run: |
          set -euo pipefail
          # ubuntu-24.04 already ships Android SDK command-line tools.
          # setup-android@v3 tries to install obsolete SDK package "tools" and
          # aborts before Gradle; use the runner SDK without that action.
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$sdk_root/cmdline-tools"
          sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager_bin" && test -x "$sdkmanager_bin"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          # yes exits with SIGPIPE after sdkmanager accepts the final license;
          # inspect sdkmanager's exit code, never mask a license failure.
          set +o pipefail
          yes | "$sdkmanager_bin" --licenses > "$RUNNER_TEMP/android-sdk-licenses.log" 2>&1
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          if [[ "$license_status" -ne 0 ]]; then
            tail -n 40 "$RUNNER_TEMP/android-sdk-licenses.log"
            exit "$license_status"
          fi
          "$sdkmanager_bin" --install 'platforms;android-35' 'build-tools;35.0.0'
          (cd apps/superagent-lan-android && bash ./gradlew --no-daemon :app:assembleDebug)
          apk=apps/superagent-lan-android/app/build/outputs/apk/debug/app-debug.apk
          metadata=apps/superagent-lan-android/app/build/outputs/apk/debug/output-metadata.json
          test -s "$apk" && test -s "$metadata"
          python -c 'import json,sys,zipfile; p,m=sys.argv[1:]; z=zipfile.ZipFile(p); assert "AndroidManifest.xml" in z.namelist() and any(x.startswith("classes") and x.endswith(".dex") for x in z.namelist()); d=json.load(open(m)); assert d["applicationId"] == "click.superagent.lanclient" and d["variantName"] == "debug"; print("ANDROID_APK_REAL_GRADLE_BUILD_OK",d["elements"][0]["versionName"])' "$apk" "$metadata"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Run Bun-native principal security tests
        run: bun test tests/delegateMcpPrincipalBinding.test.ts
      - name: Verify fast-command output and isolated Vision owner on Linux
        run: bun --bun x vitest run tests/mcpOutputRecovery.test.ts tests/managedVisionControl.test.ts --maxWorkers=2 --reporter=dot
      - name: Run vitest regression
        run: bun --bun x vitest run --maxWorkers=2 --reporter=dot --exclude tests/delegateMcpPrincipalBinding.test.ts
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
  security:
    name: Dependency high-critical release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run security:bun
