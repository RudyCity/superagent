jobs:
  core-guardian:
    name: Core guardian / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build TypeScript
        run: bun run build
      - name: Unit/Core/transport regression
        run: bun --bun x vitest run --maxWorkers=2 tests/coreGuardian.test.ts tests/coreRecoveryPhase5gToJ.test.ts tests/coreRecoveryCasebookObserver.test.ts tests/coreMcpOwnershipAudit.test.ts tests/runtimeOwnershipContract.test.ts tests/mcpOwnerControlR1.test.ts tests/mcpOwnerLifecyclePhase5n.test.ts tests/corePhase5d.test.ts tests/corePhase5e.test.ts tests/coreAgentSessionCheckpoint.test.ts tests/coreBoot.test.ts tests/coreSupervisor.test.ts tests/coreSupervisorCheckpoint.test.ts tests/coreSessionRouting.test.ts tests/coreGenerationPolicy.test.ts tests/coreDrainInspection.test.ts tests/transportHost.test.ts
      - name: Preview Windows login startup without installing scheduled tasks
        if: runner.os == 'Windows'
        run: bun scripts/setup-core-windows-startup.ts --port 7888
      - name: Fault-injection staging with intact T-Line front door
        run: bun scripts/verify-core-guardian.ts
      - name: Explicit dead-worker session resumption and no-replay gates
        run: bun scripts/verify-core-session-resume.ts
      - name: Core rolling restart and crash recovery regression
        run: bun scripts/verify-core-supervisor.ts
      - name: Bounded recovery reconciliation, independent channels and chaos matrix
        run: bun scripts/verify-core-recovery-5g-j.ts --cycles 2
      - name: Explicitly approved isolated Core canary and safe owner cleanup
        run: bun scripts/verify-core-approved-canary.ts
      - name: Independent Core and authenticated MCP HTTP owner listener test
        if: runner.os == 'Windows'
        run: bun scripts/verify-core-mcp-owner-split.ts
      - name: Managed independent MCP owner lifecycle with private stop handshake
        if: runner.os == 'Windows'
        run: bun scripts/verify-managed-mcp-lifecycle.ts
