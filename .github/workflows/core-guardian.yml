name: Core Guardian and Restart Acceptance
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/core-guardian.yml"
      - "src/core/runtime/coreGuardian.ts"
      - "src/core/runtime/coreColdStartAudit.ts"
      - "src/core/runtime/coreRecoveryEvidence.ts"
      - "src/core/runtime/coreColdReconciliation.ts"
      - "src/core/runtime/coreRecoveryCasebook.ts"
      - "src/core/runtime/coreServiceLifecycle.ts"
      - "src/core/runtime/coreLifecycleObserver.ts"
      - "src/core/runtime/coreChannelRecovery.ts"
      - "src/core/runtime/tlineReconnectProbe.ts"
      - "src/core/runtime/coreColdStartPolicy.ts"
      - "src/core/runtime/tlineReconnectPolicy.ts"
      - "src/core/runtime/coreBoot.ts"
      - "src/core/runtime/coreWindowsStartup.ts"
      - "src/core/runtime/coreSupervisor.ts"
      - "src/core/runtime/coreAgentSessionCheckpoint.ts"
      - "src/core/runtime/coreSessionRouting.ts"
      - "src/serverRoutes.ts"
      - "src/core/runtime/coreSupervisorCheckpoint.ts"
      - "src/core/runtime/transportHost.ts"
      - "src/core/commands/coreRuntimeCommand.ts"
      - "src/core/commands/commandCatalog.ts"
      - "scripts/verify-core-guardian.ts"
      - "scripts/verify-core-recovery-5g-j.ts"
      - "scripts/verify-core-session-resume.ts"
      - "scripts/setup-core-windows-startup.ts"
      - "tests/coreGuardian.test.ts"
      - "tests/coreRecoveryPhase5gToJ.test.ts"
      - "tests/coreRecoveryCasebookObserver.test.ts"
      - "tests/corePhase5d.test.ts"
      - "tests/corePhase5e.test.ts"
      - "tests/corePhase5e.test.ts"
      - "tests/coreAgentSessionCheckpoint.test.ts"
      - "tests/coreBoot.test.ts"
      - "docs/guides/core-guardian-recovery.md"
      - "docs/guides/core-agent-session-recovery.md"
      - "docs/guides/core-phase5d-restart-safety.md"
      - "docs/guides/core-phase5e-evidence-and-reconnect.md"
      - "docs/guides/core-recovery-phase5g-to-5j.md"
      - "docs/guides/core-recovery-phase5k-casebook-observer.md"
  pull_request:
    paths:
      - ".github/workflows/core-guardian.yml"
      - "src/core/runtime/coreGuardian.ts"
      - "src/core/runtime/coreColdStartAudit.ts"
      - "src/core/runtime/coreRecoveryEvidence.ts"
      - "src/core/runtime/coreColdReconciliation.ts"
      - "src/core/runtime/coreRecoveryCasebook.ts"
      - "src/core/runtime/coreServiceLifecycle.ts"
      - "src/core/runtime/coreLifecycleObserver.ts"
      - "src/core/runtime/coreChannelRecovery.ts"
      - "src/core/runtime/tlineReconnectProbe.ts"
      - "src/core/runtime/coreColdStartPolicy.ts"
      - "src/core/runtime/tlineReconnectPolicy.ts"
      - "src/core/runtime/coreBoot.ts"
      - "src/core/runtime/coreWindowsStartup.ts"
      - "src/core/runtime/coreSupervisor.ts"
      - "src/core/runtime/coreAgentSessionCheckpoint.ts"
      - "src/core/runtime/coreSessionRouting.ts"
      - "src/serverRoutes.ts"
      - "src/core/runtime/coreSupervisorCheckpoint.ts"
      - "src/core/runtime/transportHost.ts"
      - "scripts/verify-core-guardian.ts"
      - "scripts/verify-core-recovery-5g-j.ts"
      - "scripts/verify-core-session-resume.ts"
      - "scripts/setup-core-windows-startup.ts"
      - "tests/coreGuardian.test.ts"
      - "tests/coreRecoveryPhase5gToJ.test.ts"
      - "tests/coreRecoveryCasebookObserver.test.ts"
      - "tests/corePhase5d.test.ts"
      - "tests/coreAgentSessionCheckpoint.test.ts"
      - "tests/coreBoot.test.ts"
      - "docs/guides/core-guardian-recovery.md"
      - "docs/guides/core-agent-session-recovery.md"
      - "docs/guides/core-phase5d-restart-safety.md"
      - "docs/guides/core-phase5e-evidence-and-reconnect.md"
      - "docs/guides/core-recovery-phase5g-to-5j.md"
      - "docs/guides/core-recovery-phase5k-casebook-observer.md"
  workflow_dispatch:
jobs:
  core-guardian:
    name: Core guardian / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build TypeScript
        run: bun run build
      - name: Unit/Core/transport regression
        run: bun --bun x vitest run --maxWorkers=2 tests/coreGuardian.test.ts tests/coreRecoveryPhase5gToJ.test.ts tests/coreRecoveryCasebookObserver.test.ts tests/corePhase5d.test.ts tests/corePhase5e.test.ts tests/coreAgentSessionCheckpoint.test.ts tests/coreBoot.test.ts tests/coreSupervisor.test.ts tests/coreSupervisorCheckpoint.test.ts tests/coreSessionRouting.test.ts tests/coreGenerationPolicy.test.ts tests/coreDrainInspection.test.ts tests/transportHost.test.ts
      - name: Preview Windows login startup without installing scheduled tasks
        if: runner.os == 'Windows'
        run: bun scripts/setup-core-windows-startup.ts --port 7888
      - name: Fault-injection staging with intact T-Line front door
        run: bun scripts/verify-core-guardian.ts
      - name: Explicit dead-worker session resumption and no-replay gates
        run: bun scripts/verify-core-session-resume.ts
      - name: Core rolling restart and crash recovery regression
        run: bun scripts/verify-core-supervisor.ts
      - name: Bounded recovery reconciliation, independent channels and chaos matrix
        run: bun scripts/verify-core-recovery-5g-j.ts --cycles 2
