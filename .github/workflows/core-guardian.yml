name: Core Guardian and Restart Acceptance
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/core-guardian.yml"
      - "src/core/runtime/coreGuardian.ts"
      - "src/core/runtime/coreSupervisor.ts"
      - "src/core/runtime/coreSupervisorCheckpoint.ts"
      - "src/core/runtime/transportHost.ts"
      - "src/core/commands/coreRuntimeCommand.ts"
      - "src/core/commands/commandCatalog.ts"
      - "scripts/verify-core-guardian.ts"
      - "tests/coreGuardian.test.ts"
      - "docs/guides/core-guardian-recovery.md"
  pull_request:
    paths:
      - ".github/workflows/core-guardian.yml"
      - "src/core/runtime/coreGuardian.ts"
      - "src/core/runtime/coreSupervisor.ts"
      - "src/core/runtime/coreSupervisorCheckpoint.ts"
      - "src/core/runtime/transportHost.ts"
      - "scripts/verify-core-guardian.ts"
      - "tests/coreGuardian.test.ts"
      - "docs/guides/core-guardian-recovery.md"
  workflow_dispatch:
jobs:
  core-guardian:
    name: Core guardian / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build TypeScript
        run: bun run build
      - name: Unit/Core/transport regression
        run: bun --bun x vitest run --maxWorkers=2 tests/coreGuardian.test.ts tests/coreSupervisor.test.ts tests/coreSupervisorCheckpoint.test.ts tests/coreSessionRouting.test.ts tests/coreGenerationPolicy.test.ts tests/coreDrainInspection.test.ts tests/transportHost.test.ts
      - name: Fault-injection staging with intact T-Line front door
        run: bun scripts/verify-core-guardian.ts
      - name: Core rolling restart and crash recovery regression
        run: bun scripts/verify-core-supervisor.ts
