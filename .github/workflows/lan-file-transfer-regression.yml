name: LAN File Transfer Regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/core/lanRemote/**"
      - "src/core/runtime/trayLanBridge.ts"
      - "apps/superagent-lan-android/app/src/main/java/click/superagent/lanclient/LanFileExchange.java"
      - "apps/superagent-lan-android/app/src/main/java/click/superagent/lanclient/LanFileExchangeV2.java"
      - "apps/superagent-lan-android/app/src/main/java/click/superagent/lanclient/LanTransferForegroundService.java"
      - "apps/superagent-lan-android/app/src/main/java/click/superagent/lanclient/MainActivity.java"
      - "apps/superagent-lan-android/app/src/main/AndroidManifest.xml"
      - "apps/superagent-lan-android/app/src/main/java/click/superagent/lanclient/LanClientServer.java"
      - "apps/superagent-tray/ui/lan-file-transfer.js"
      - "apps/superagent-tray/ui/lan-file-relay.js"
      - "apps/superagent-tray/ui/lan-sha256.js"
      - "apps/superagent-tray/ui/lan-devices.js"
      - "apps/superagent-tray/ui/lan-devices.css"
      - "apps/superagent-tray/ui/index.html"
      - "apps/superagent-tray/src-tauri/src/main.rs"
      - "tests/lanFileTransfer.test.ts"
      - "tests/lanFileTransferE2E.test.ts"
      - "tests/lanFolderPackage.test.ts"
      - "tests/androidLanFileContract.test.ts"
      - "tests/desktopTrayLanFilesUi.test.ts"
      - "tests/desktopTrayLanFolderUi.test.ts"
      - "tests/lanFileQueueRecovery.test.ts"
      - "tests/lanFileStatusE2E.test.ts"
      - "tests/lanFilePauseResume.test.ts"
      - "tests/androidLanCancelContract.test.ts"
      - "tests/lanDiskTransferV2.test.ts"
      - "tests/lanStreamingSha256.test.ts"
      - "tests/lanV2TrayStreaming.test.ts"
      - "tests/lanMultiDeviceQueue.test.ts"
      - "tests/lanFileRelayManager.test.ts"
      - "tests/androidLanBackgroundTransferContract.test.ts"
      - "tests/trayLanBridge.test.ts"
      - ".github/workflows/lan-file-transfer-regression.yml"
  pull_request:
    paths:
      - "src/core/lanRemote/**"
      - "src/core/runtime/trayLanBridge.ts"
      - "apps/superagent-lan-android/app/src/main/java/click/superagent/lanclient/**"
      - "apps/superagent-tray/ui/lan-file-transfer.js"
      - "apps/superagent-tray/ui/lan-file-relay.js"
      - "apps/superagent-tray/ui/lan-sha256.js"
      - "apps/superagent-tray/ui/lan-devices.js"
      - "apps/superagent-tray/ui/lan-devices.css"
      - "apps/superagent-tray/ui/index.html"
      - "apps/superagent-tray/src-tauri/src/main.rs"
      - "tests/lan*.test.ts"
      - "tests/androidLanFileContract.test.ts"
      - "tests/desktopTrayLanFilesUi.test.ts"
      - "tests/desktopTrayLanFolderUi.test.ts"
      - "tests/trayLanBridge.test.ts"
      - ".github/workflows/lan-file-transfer-regression.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Preserve a complete evidence run while agents push unrelated work.
  cancel-in-progress: false

jobs:
  file-transfer:
    name: LAN protocol and UI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun --bun x tsc --noEmit --pretty false
      - name: Verify LAN UI JavaScript syntax
        if: ${{ always() && !cancelled() }}
        run: |
          node --check apps/superagent-tray/ui/lan-file-transfer.js
          node --check apps/superagent-tray/ui/lan-file-relay.js
          node --check apps/superagent-tray/ui/lan-sha256.js
          node --check apps/superagent-tray/ui/lan-devices.js
      - name: Run transfer, folder, owner-approval and UI regressions
        if: ${{ always() && !cancelled() }}
        run: >-
          bun --bun x vitest run --maxWorkers=2
          tests/lanRemote.test.ts
          tests/lanFileTransfer.test.ts
          tests/lanFileTransferE2E.test.ts
          tests/lanFolderPackage.test.ts
          tests/androidLanFileContract.test.ts
          tests/desktopTrayLanFilesUi.test.ts
          tests/desktopTrayLanFolderUi.test.ts
          tests/lanFileQueueRecovery.test.ts
          tests/lanFileStatusE2E.test.ts
          tests/lanFilePauseResume.test.ts
          tests/androidLanCancelContract.test.ts
          tests/lanDiskTransferV2.test.ts
          tests/lanStreamingSha256.test.ts
          tests/lanV2TrayStreaming.test.ts
          tests/lanMultiDeviceQueue.test.ts
          tests/lanFileRelayManager.test.ts
          tests/androidLanBackgroundTransferContract.test.ts
          tests/trayLanBridge.test.ts

  android-java:
    name: Android native Java compile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Ensure Android API 35 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager_bin" && test -x "$sdkmanager_bin"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          if [ ! -f "$sdk_root/platforms/android-35/android.jar" ]; then
            set +o pipefail
            yes | "$sdkmanager_bin" --licenses >/dev/null 2>&1
            license_status=${PIPESTATUS[1]}
            set -o pipefail
            test "$license_status" -eq 0
            "$sdkmanager_bin" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Compile Android LAN client Java
        shell: bash
        run: |
          set -euo pipefail
          cd apps/superagent-lan-android
          bash ./gradlew --no-daemon :app:compileDebugJavaWithJavac
