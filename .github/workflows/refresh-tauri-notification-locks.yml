name: Refresh Tauri notification Cargo locks (one-off)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-tauri-notification-locks.yml

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve the exact notification plugin version in both native apps
        run: |
          cargo update --manifest-path apps/superagent-tray/src-tauri/Cargo.toml -p tauri-plugin-notification --precise 2.8.1
          cargo update --manifest-path apps/superagent-lan-windows/src-tauri/Cargo.toml -p tauri-plugin-notification --precise 2.8.1

      - name: Commit only generated lockfiles and remove this one-off workflow
        run: |
          git rm .github/workflows/refresh-tauri-notification-locks.yml
          git add apps/superagent-tray/src-tauri/Cargo.lock apps/superagent-lan-windows/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo lockfiles did not change; refusing to create an empty refresh commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Tauri notification Cargo lockfiles"
          git push origin HEAD:main
