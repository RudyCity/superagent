      - ".github/workflows/mcp-fast-regression.yml"
  pull_request:
    paths:
      - "src/core/mcp/**"
      - "package.json"
      - "bun.lock"
      - "src/core/tools/mcpTools.ts"
      - "src/app.tsx" # CLI StatusBar uses the same Core build entrypoint
      - "scripts/mcp-tool-policy-live-verify.ts"
      - "scripts/report-mcp-policy-readiness.ts"
      - "src/core/runtime/mcpManagedTunnelOwner.ts"
      - "src/core/runtime/serviceManager.ts"
      - "src/core/runtime/serviceReadPolicy.ts"
