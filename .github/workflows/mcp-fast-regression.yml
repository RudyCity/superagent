name: MCP Fast Regression
on:
  push:
    branches: [main]
    paths:
      - "src/core/mcp/**"
      - "src/core/tools/mcpTools.ts"
      - "src/core/tools/registeredFileToolGate.ts"
      - "src/core/tools/browserFilePolicyCertification.ts"
      - "src/core/tools/safeManagedChromeObservation.ts"
      - "src/core/tools/chromeProcessTools.ts"
      - "src/core/tools/crossIdeCdpGateway.ts"
      - "tests/safeManagedChromeObservation.test.ts"
      - "tests/desktop-ui-integration/registered-file-tool-gate.test.ts"
      - "tests/mcp*.test.ts"
      - "tests/desktopAccessManagerTrayUi.test.ts"
      - "tests/desktopRuntimeUi.test.ts"
      - "apps/superagent-tray/ui/runtime.js"
      - "tests/projectOperatorProof.test.ts"
      - "apps/superagent-tray/ui/access-manager.js"
      - "apps/superagent-tray/src-tauri/src/main.rs"
      - "src/serverRoutes.ts"
      - "src/core/project/projectOperator*.ts"
      - "apps/superagent-tray/ui/access-manager.css"
      - "apps/superagent-tray/ui/overview-operations.js"
      - "apps/superagent-tray/ui/index.html"
      - "tests/desktopOverviewOperations.test.ts"
      - ".github/workflows/mcp-fast-regression.yml"
  pull_request:
    paths:
      - "src/core/mcp/**"
      - "src/core/tools/mcpTools.ts"
      - "src/core/tools/registeredFileToolGate.ts"
      - "src/core/tools/browserFilePolicyCertification.ts"
      - "src/core/tools/safeManagedChromeObservation.ts"
      - "src/core/tools/chromeProcessTools.ts"
      - "src/core/tools/crossIdeCdpGateway.ts"
      - "tests/safeManagedChromeObservation.test.ts"
      - "tests/desktop-ui-integration/registered-file-tool-gate.test.ts"
      - "tests/mcp*.test.ts"
      - "tests/desktopAccessManagerTrayUi.test.ts"
      - "tests/desktopRuntimeUi.test.ts"
      - "apps/superagent-tray/ui/runtime.js"
      - "tests/projectOperatorProof.test.ts"
      - "apps/superagent-tray/ui/access-manager.js"
      - "apps/superagent-tray/src-tauri/src/main.rs"
      - "src/serverRoutes.ts"
      - "src/core/project/projectOperator*.ts"
      - "apps/superagent-tray/ui/access-manager.css"
      - "apps/superagent-tray/ui/overview-operations.js"
      - "apps/superagent-tray/ui/index.html"
      - "tests/desktopOverviewOperations.test.ts"
      - ".github/workflows/mcp-fast-regression.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    name: MCP response, paging, metrics and protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun --bun x tsc --noEmit
      - name: MCP focused regression
        if: ${{ always() && !cancelled() }}
        run: |
          bun --bun x vitest run --maxWorkers=2 \
            tests/mcpToolMetrics.test.ts \
            tests/mcpToolResultFormatter.test.ts \
            tests/mcpLogTail.test.ts \
            tests/mcpTextFilePaging.test.ts \
            tests/mcpOutputRecovery.test.ts \
            tests/mcpToolGateway.test.ts \
            tests/mcpFilePolicyMatrix.test.ts \
            tests/mcpApprovalAndFilePolicy.test.ts \
            tests/mcpExactFileSearch.test.ts \
            tests/mcpExplicitGrepIntegration.test.ts \
            tests/mcpGatewayHttp.test.ts \
            tests/mcpSessionRegistry.test.ts \
            tests/mcpResponseLease.test.ts \
            tests/desktopOverviewOperations.test.ts \
            tests/desktopAccessManagerTrayUi.test.ts \
            tests/desktopRuntimeUi.test.ts \
            tests/mcpProjectAccessOperatorRoutes.test.ts \
            tests/projectOperatorProof.test.ts \
            tests/mcpCrossIdeGateway.test.ts \
            tests/safeManagedChromeObservation.test.ts \
            tests/desktop-ui-integration/registered-file-tool-gate.test.ts

  policy-cross-platform:
    name: MCP host policy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify MCP permission and file policy matrix
        run: >
          bun --bun x vitest run --maxWorkers=2
          tests/mcpApprovalAndFilePolicy.test.ts
          tests/mcpExactFileSearch.test.ts
          tests/mcpExplicitGrepIntegration.test.ts
          tests/mcpFilePolicyMatrix.test.ts
          tests/desktop-ui-integration/registered-file-tool-gate.test.ts
          tests/mcpCrossIdeGateway.test.ts
          tests/safeManagedChromeObservation.test.ts
