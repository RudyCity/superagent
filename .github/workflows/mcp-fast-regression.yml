      - "apps/superagent-tray/ui/runtime.js"
      - "tests/projectOperatorProof.test.ts"
      - "apps/superagent-tray/ui/access-manager.js"
      - "apps/superagent-tray/ui/notifications.js"
      - "apps/superagent-tray/ui/app.js"
      - "apps/superagent-tray/src-tauri/src/**"
      - "apps/superagent-tray/src-tauri/build.rs"
      - "apps/superagent-tray/src-tauri/Cargo.toml"
      - "apps/superagent-tray/src-tauri/Cargo.lock"
      - "apps/superagent-tray/src-tauri/tauri.conf.json"
      - "src/serverRoutes.ts"
      - "src/core/project/projectOperator*.ts"
      - "src/core/project/projectAccessPolicy.ts"
      - "apps/superagent-tray/ui/access-manager.css"
      - "apps/superagent-tray/ui/overview-operations.js"
      - "apps/superagent-tray/ui/index.html"
      - "tests/desktopOverviewOperations.test.ts"
      - ".github/workflows/mcp-fast-regression.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    name: MCP response, paging, metrics and protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun --bun x tsc --noEmit
      - name: Build Core TypeScript artifacts
        run: bun run build
      - name: MCP focused regression
        if: ${{ always() && !cancelled() }}
        run: |
          bun --bun x vitest run --maxWorkers=2 \
            tests/mcpToolMetrics.test.ts \
            tests/mcpToolResultFormatter.test.ts \
            tests/mcpLogTail.test.ts \
            tests/mcpTextFilePaging.test.ts \
            tests/mcpOutputRecovery.test.ts \
            tests/mcpToolGateway.test.ts \
            tests/mcpFilePolicyMatrix.test.ts \
            tests/mcpOAuthRoutes.test.ts \
            tests/mcpOAuthStore.test.ts \
            tests/mcpDelegateWebCertification.test.ts \
            tests/mcpPolicyReadinessReport.test.ts \
            tests/mcpApprovalAndFilePolicy.test.ts \
            tests/mcpPermissionDecision.test.ts \
            tests/mcpServicePermissionParity.test.ts \
            tests/mcpPolicyStorePrivacy.test.ts \
            tests/mcpDefaultProjectAuthorization.test.ts \
            tests/serviceOwnerAttestation.test.ts \
            tests/checkoutRevision.test.ts \
            tests/serviceManagerMcp.test.ts \
            tests/mcpExactFileSearch.test.ts \
            tests/mcpExplicitGrepIntegration.test.ts \
            tests/mcpPolicyHttpSmoke.test.ts \
            tests/mcpLiveVerifierDiagnostics.test.ts \
            tests/desktop-ui-activation/live-activation-gate.test.ts \
            tests/mcpGatewayHttp.test.ts \
            tests/mcpSessionRegistry.test.ts \
            tests/mcpConnectedClientRegistry.test.ts \
            tests/mcpResponseLease.test.ts \
            tests/desktopOverviewOperations.test.ts \
            tests/desktopAccessManagerTrayUi.test.ts \
            tests/desktopTrayNotificationsUi.test.ts \
            tests/desktopTrayFeedback.test.ts \
            tests/desktopRuntimeUi.test.ts \
            tests/mcpProjectAccessOperatorRoutes.test.ts \
            tests/projectOperatorProof.test.ts \
            tests/mcpCrossIdeGateway.test.ts \
            tests/safeManagedChromeObservation.test.ts \
            tests/safeDelegateChromeObservation.test.ts \
            tests/managedChromeLaunchPlan.test.ts \
            tests/trayManagedChrome.test.ts \
            tests/managedChromeTrayUi.test.ts \
            tests/browserRuntimeLaunchOwnership.test.ts \
            tests/desktop-ui-integration/registered-file-tool-gate.test.ts

      - name: Non-mutating source policy and release-readiness report
        run: bun scripts/report-mcp-policy-readiness.ts

  policy-cross-platform:
    name: MCP host policy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify MCP permission and file policy matrix
        run: >
          bun --bun x vitest run --maxWorkers=2
          tests/mcpApprovalAndFilePolicy.test.ts
          tests/mcpPermissionDecision.test.ts
          tests/mcpServicePermissionParity.test.ts
          tests/mcpPolicyStorePrivacy.test.ts
          tests/mcpDefaultProjectAuthorization.test.ts
          tests/serviceOwnerAttestation.test.ts
          tests/checkoutRevision.test.ts
          tests/serviceManagerMcp.test.ts
          tests/mcpOAuthStore.test.ts
          tests/mcpOAuthRoutes.test.ts
          tests/mcpToolGateway.test.ts
          tests/mcpSessionRegistry.test.ts
          tests/mcpConnectedClientRegistry.test.ts
          tests/desktopAccessManagerTrayUi.test.ts
          tests/desktopTrayNotificationsUi.test.ts
          tests/desktopTrayFeedback.test.ts
          tests/desktop-ui-integration/persistent-access-policy.test.ts
          tests/desktop-ui-integration/trusted-desktop-input.test.ts
          tests/lanFileQueueRecovery.test.ts
          tests/lanFileRelayManager.test.ts
          tests/mcpExactFileSearch.test.ts
          tests/mcpExplicitGrepIntegration.test.ts
          tests/mcpPolicyHttpSmoke.test.ts
          tests/mcpLiveVerifierDiagnostics.test.ts
          tests/desktop-ui-activation/live-activation-gate.test.ts
          tests/mcpFilePolicyMatrix.test.ts
          tests/mcpDelegateWebCertification.test.ts
          tests/mcpPolicyReadinessReport.test.ts
          tests/desktop-ui-integration/registered-file-tool-gate.test.ts
          tests/mcpCrossIdeGateway.test.ts
          tests/safeManagedChromeObservation.test.ts
          tests/safeDelegateChromeObservation.test.ts
          tests/managedChromeLaunchPlan.test.ts
          tests/trayManagedChrome.test.ts
          tests/managedChromeTrayUi.test.ts
          tests/browserRuntimeLaunchOwnership.test.ts
