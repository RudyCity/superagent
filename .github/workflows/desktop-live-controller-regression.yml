name: Desktop Live Controller Regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/core/desktopUi/remoteControlAuthority.ts"
      - "src/core/desktopUi/attendedNativeControllerSession.ts"
      - "src/core/desktopUi/attendedPrivateDesktopHostSession.ts"
      - "src/core/desktopUi/remotePrivateControllerTls.ts"
      - "src/core/desktopUi/remotePrivateControllerClient.ts"
      - "src/core/desktopUi/remoteNativeInputDispatch.ts"
      - "src/core/desktopUi/remoteInputGuard.ts"
      - "src/core/desktopUi/remotePrivateTransport.ts"
      - "src/core/desktopUi/remotePrivateViewerClient.ts"
      - "src/core/desktopUi/remotePrivateHostTlsListener.ts"
      - "src/core/desktopUi/adapters/windowsRemoteSemantic.ts"
      - "tests/desktop-live/remote*.test.ts"
      - "tests/desktop-live/attendedNativeControllerSession.test.ts"
      - "tests/desktop-live/attendedPrivateDesktopHostSession.test.ts"
      - "tests/desktop-live/remotePrivateControllerTls.test.ts"
      - "tests/desktop-live/windowsRemoteSemantic*.test.ts"
      - "src/core/desktopUi/nativeAndroidControllerApproval.ts"
      - "src/core/desktopUi/nativeApprovalProof.ts"
      - "src/core/desktopUi/desktopLiveAccessModes.ts"
      - "src/core/desktopUi/desktopLiveInventory.ts"
      - "src/core/runtime/trayLanBridge.ts"
      - "src/core/lanRemote/fileRelayManager.ts"
      - "src/serverRoutes.ts"
      - "apps/superagent-tray/src-tauri/src/desktop_live_android_control.rs"
      - "apps/superagent-tray/src-tauri/src/main.rs"
      - "apps/superagent-tray/ui/desktop-live-manager.js"
      - "apps/superagent-tray/ui/lan-screen-viewer.js"
      - "apps/superagent-tray/ui/index.html"
      - "tests/desktop-live/nativeAndroidControllerApproval.test.ts"
      - "tests/desktop-live/desktopLiveAccessModes.test.ts"
      - "tests/desktop-live/desktopLiveTakeoverAuthorization.test.ts"
      - "tests/desktop-live/trayManagementSurface.test.ts"
      - "tests/desktop-live/trayAndroidGestures.test.ts"
      - "tests/androidLanRemoteScreen.test.ts"
      - "tests/androidLanSchemaFirst.test.ts"
      - "tests/desktopTrayAndroidScreenUi.test.ts"
      - "tests/trayLanBridge.test.ts"
      - ".github/workflows/desktop-live-controller-regression.yml"
permissions:
  contents: read
concurrency:
  group: desktop-live-controller-${{ github.ref }}
  cancel-in-progress: false
jobs:
  core:
    name: Native-controller Core contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: TypeScript typecheck
        run: bun --bun x tsc --noEmit --pretty false
      - name: Native Tray WebView syntax
        if: ${{ always() && !cancelled() }}
        run: |
          node --check apps/superagent-tray/ui/desktop-live-manager.js
          node --check apps/superagent-tray/ui/lan-screen-viewer.js
      - name: View and controller integration tests
        if: ${{ always() && !cancelled() }}
        run: >-
          bun --bun x vitest run --maxWorkers=2
          tests/desktop-live/remoteControlAuthority.test.ts
          tests/desktop-live/attendedNativeControllerSession.test.ts
          tests/desktop-live/attendedPrivateDesktopHostSession.test.ts
          tests/desktop-live/remotePrivateControllerTls.test.ts
          tests/desktop-live/remoteNativeInputDispatch.test.ts
          tests/desktop-live/remoteInputGuard.test.ts
          tests/desktop-live/remotePrivateTransport.test.ts
          tests/desktop-live/remotePrivateViewerClient.test.ts
          tests/desktop-live/remotePrivateEndToEnd.test.ts
          tests/desktop-live/remotePrivateHostTlsListener.test.ts
          tests/desktop-live/remotePrivateOperator.test.ts
          tests/desktop-live/windowsRemoteSemantic.test.ts
          tests/desktop-live/nativeAndroidControllerApproval.test.ts
          tests/desktop-live/desktopLiveAccessModes.test.ts
          tests/desktop-live/desktopLiveTakeoverAuthorization.test.ts
          tests/desktop-live/trayManagementSurface.test.ts
          tests/desktop-live/trayAndroidGestures.test.ts
          tests/desktop-live/lanLiveStream.test.ts
          tests/androidLanRemoteScreen.test.ts
          tests/androidLanSchemaFirst.test.ts
          tests/desktopTrayAndroidScreenUi.test.ts
          tests/trayLanBridge.test.ts

  native-gate:
    name: Isolated Rust controller gate unit tests (Windows)
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile standard-library-only controller gate and execute tests
        shell: pwsh
        run: |
          $testExe = Join-Path $env:RUNNER_TEMP 'android-controller-gate-tests.exe'
          rustc --edition=2021 --test apps/superagent-tray/src-tauri/src/desktop_live_android_control.rs -o $testExe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $testExe --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  native:
    name: Rust attended-controller gate (Windows)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Prepare Core dist resources for Tauri build script
        run: bun run build
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/superagent-tray/src-tauri -> target"
      - name: Native Android controller unit tests and full Tray compile
        run: cargo test --manifest-path apps/superagent-tray/src-tauri/Cargo.toml desktop_live_android_control::tests
