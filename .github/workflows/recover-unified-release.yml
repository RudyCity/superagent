name: Recover verified unified SuperAgent release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed tagged multi-OS workflow run with all six build jobs successful"
        type: string
        required: true
      tag:
        description: "Exact existing vX.Y.Z-rc.N tag from that run"
        type: string
        required: true

permissions:
  actions: read
  contents: write

concurrency:
  group: recover-unified-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  recover:
    name: Validate tagged provenance and publish verified archived builds
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate original run, immutable tag and six successful build jobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          TARGET_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]+$ ]] || { echo "Invalid run ID"; exit 1; }
          [[ "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]] || { echo "Invalid release tag"; exit 1; }
          version="$(node -p "require('./package.json').version")"
          [[ "$TARGET_TAG" == "v${version}-rc."* ]] || { echo "Recovery version mismatch"; exit 1; }
          sha="$(git rev-parse "refs/tags/$TARGET_TAG^{}")"
          tagged_version="$(git show "$TARGET_TAG:package.json" | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>console.log(JSON.parse(s).version))')"
          [[ "$tagged_version" == "$version" ]] || { echo "Tagged source package version mismatch"; exit 1; }
          if gh release view "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Target release already exists: refusing duplicate or overwrite"
            exit 1
          fi
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e --arg sha "$sha" --arg tag "$TARGET_TAG" '
            .event=="push" and .head_branch==$tag and .head_sha==$sha and
            .status=="completed" and .conclusion=="failure" and
            .path==".github/workflows/release-windows-standalone.yml"
          ' <<< "$run" || { echo "Original run provenance mismatch"; exit 1; }
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100")"
          for required in             "Build & test windows-x64"             "Build & test macos-arm64"             "Build & test linux-x64"             "Build verified Chrome Delegate and SidePanel"             "Build verified Android LAN preview APK (debug-signed)"             "Build and verify Windows LAN receiver GUI preview"; do
            jq -e --arg name "$required"               '[.jobs[] | select(.name==$name and .conclusion=="success")] | length==1'               <<< "$jobs" >/dev/null || { echo "A required tagged build was not successful: $required"; exit 1; }
          done
          jq -e '[.jobs[] | select(.name=="Publish unified verified standalone and preview components" and .conclusion=="failure")] | length==1'             <<< "$jobs" >/dev/null || { echo "No matching failed publication gate to recover"; exit 1; }
          echo "TAGGED_BUILD_PROVENANCE_VERIFIED tag=$TARGET_TAG sha=$sha run=$SOURCE_RUN_ID"
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          pattern: release-*
          merge-multiple: true
          path: downloaded-assets
      - name: Verify original artifacts and generate complete SHA-256 inventory
        shell: bash
        run: |
          set -euo pipefail
          node scripts/normalize-unified-release-assets.mjs downloaded-assets
          node scripts/verify-unified-release-assets.mjs downloaded-assets
          mkdir -p release-assets
          cp -- downloaded-assets/* release-assets/
          (cd release-assets && sha256sum ./* > ../SHA256SUMS.txt)
          [[ "$(wc -l < SHA256SUMS.txt)" -eq 11 ]] || { echo "Bad checksum inventory"; exit 1; }
          (cd release-assets && sha256sum --check ../SHA256SUMS.txt)
          echo "RECOVERED_RELEASE_ASSET_INTEGRITY_VERIFIED"
      - name: Publish complete unified prerelease without rebuilding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          core_version="$(node -p 'require("./package.json").version')"
          delegate_version="$(node -p 'require("./chrome-extension-delegate/manifest.json").version')"
          sidepanel_version="$(node -p 'require("./chrome-extension/manifest.json").version')"
          lan_version="$(node -p 'require("./apps/superagent-lan-windows/src-tauri/tauri.conf.json").version')"
          android_version="$(grep -oE "versionName '[^']+'" apps/superagent-lan-android/app/build.gradle | cut -d"'" -f2)"
          cat > RELEASE_NOTES.md <<EOF
          # SuperAgent $TARGET_TAG — Unified Multi-OS & Extensions Release

          All binaries were built on dedicated native CI runners from the exact
          tagged commit, with six independent, successful build/test jobs.

          ### Component Versions & Downloads
          - **Windows x64 (v${core_version})**: \`SuperAgent_${core_version}_x64-setup.exe\` — Standalone NSIS installer (Tray + Core + Bun + native CLI).
          - **Ubuntu / Debian Linux x64 (v${core_version})**: \`SuperAgent_${core_version}_amd64.deb\` — Debian/Ubuntu native package.
          - **Linux x64 Portable (v${core_version})**: \`SuperAgent_${core_version}_amd64.AppImage\` — Standalone AppImage with verified glibc native addons.
          - **macOS ARM64 Apple Silicon (v${core_version})**: \`SuperAgent_${core_version}_aarch64.dmg\` — Unsigned DMG bundle.
          - **Chrome Delegate Extension (v${delegate_version})**: \`superagent-delegate-${delegate_version}.zip\` (with verified receipt) — MV3 developer extension for ChatGPT automation.
          - **Chrome SidePanel Extension (v${sidepanel_version})**: \`superagent-sidepanel-${sidepanel_version}.zip\` (with verified receipt) — MV3 AI assistant sidepanel.
          - **Windows LAN Receiver GUI (v${lan_version})**: \`SuperAgent-LAN-Client-${lan_version}-Windows-x64-setup.exe\` — Desktop LAN client preview installer.
          - **Android LAN Preview (v${android_version})**: \`SuperAgent-LAN-Android-${android_version}-debug.apk\` + metadata — Debug-signed APK.
          - **Checksum Manifest**: \`SHA256SUMS.txt\` — SHA-256 checksums for all 11 binary, archive and metadata assets.

          The release does not migrate users, modify Core/MCP ownership, restart a
          running instance or certify production deployment (R0–R7 remain separate).
          Verify checksum and provenance before installing.
          EOF
          release_title="SuperAgent $TARGET_TAG — Windows v${core_version}, Ubuntu v${core_version}, macOS v${core_version}, Delegate v${delegate_version}, SidePanel v${sidepanel_version}, LAN v${lan_version}, Android v${android_version}"
          gh release create "$TARGET_TAG" release-assets/* SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "$release_title" \
            --notes-file RELEASE_NOTES.md
          asset_count="$(gh release view "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          [[ "$asset_count" == "12" ]] || { echo "Published release is missing assets: $asset_count/12"; exit 1; }
          gh release view "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease,assets --jq             '{url,isDraft,isPrerelease,assets:[.assets[]|{name,size}]}'
          echo "UNIFIED_RECOVERED_RELEASE_PUBLISHED $TARGET_TAG"
